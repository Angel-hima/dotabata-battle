<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>ドタバタバトル！</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN", "Yu Gothic",system-ui,sans-serif;background:#0c1024;color:#f8f9ff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:radial-gradient(circle at 20% 5%,#37236b 0%,transparent 36%),radial-gradient(circle at 90% 90%,#103a62 0%,transparent 40%),#0b1024}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}#app{height:100%;height:100dvh;overflow:auto;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.page{max-width:1040px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:13px;min-height:0}.setup,.summary{align-items:center;justify-content:center;overflow:auto;min-height:min(600px,100%)}.hero{text-align:center}.eyebrow{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.18em;background:#fcca48;color:#21172b;border-radius:999px;padding:6px 14px}.hero h1{font-size:clamp(32px,5vw,61px);margin:8px 0 3px;letter-spacing:.05em;text-shadow:0 5px 25px #cb4be677}.hero p{margin:4px;color:#bbc1df;font-weight:600}.glass{background:#191f3ccf;border:1px solid #59608b69;border-radius:20px;box-shadow:0 15px 50px #0004}.setup-panel{width:min(690px,100%);padding:18px 20px;display:flex;flex-direction:column;gap:12px}.setting-line{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.setting-label{font-weight:900}.seg{display:flex;gap:7px}.seg button{background:#353b5e;border:2px solid transparent;color:#dce0fe;border-radius:12px;padding:10px 22px;font-weight:900}.seg button.active{background:#6b3de0;border-color:#c4a9ff;color:#fff}.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.name-row{display:flex;gap:8px;align-items:center;padding:9px;background:#282d4b;border-radius:13px}.dot{display:block;width:18px;height:18px;flex:0 0 18px;border-radius:50%;background:var(--p)}.name-row input{width:100%;min-width:0;padding:5px;background:transparent;border:0;border-bottom:1px solid #676d8e;color:#fff;outline:none;font-weight:800}.name-row label{font-size:12px;color:#c2c7e2;font-weight:800;white-space:nowrap}.primary,.secondary{background:linear-gradient(110deg,#ffcf51,#ff7f70);color:#251730;border:0;border-radius:14px;padding:12px 25px;font-weight:1000;font-size:19px;box-shadow:0 6px 0 #853d5e;transition:transform .1s}.primary:active,.secondary:active{transform:translateY(3px);box-shadow:0 3px 0 #853d5e}.secondary{background:#3a436c;box-shadow:0 5px 0 #202845;color:#fff;font-size:15px}.hint{text-align:center;color:#aab4d6;font-size:12px;line-height:1.5;margin:0}.top{display:flex;justify-content:space-between;align-items:center;gap:9px;flex:0 0 auto}.logo{font-weight:1000;letter-spacing:.06em;font-size:clamp(16px,2.4vw,23px);white-space:nowrap}.pill{border:1px solid #717ba466;background:#202648;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900}.score-line{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.score-chip{font-size:12px;font-weight:900;background:#252b4d;border:1px solid #717ba466;border-radius:10px;padding:7px 9px;white-space:nowrap}.score-chip .s-dot{color:var(--p);font-size:14px}.intro{align-items:center;justify-content:center;text-align:center}.intro .glass{width:min(610px,100%);padding:24px;display:flex;flex-direction:column;gap:14px}.bigemoji{font-size:55px}.intro h2,.summary h2{font-size:clamp(29px,4.5vw,49px);margin:0}.intro p{color:#c6cbea;line-height:1.6;margin:0}.tag{color:#ffe691;letter-spacing:.12em;font-weight:950;font-size:13px}.arena{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:9px}.zone{position:relative;min-height:0;overflow:hidden;border-radius:20px;border:3px solid var(--p);background:linear-gradient(150deg,#31375f,#111731);background:linear-gradient(150deg, color-mix(in srgb,var(--p) 34%, #161b38),#111731);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;touch-action:none;user-select:none;-webkit-user-select:none}.zone.no-player{border-color:#525a7c;background:#151a34}.zone-top{position:absolute;top:7px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}.zone-name{font-weight:1000;font-size:clamp(14px,2vw,22px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.zone-stat{font-weight:1000;font-size:clamp(13px,2.2vw,26px);background:#0c1124a6;border-radius:10px;padding:3px 8px}.zone-button{width:min(74%,260px);height:min(65%,160px);min-height:72px;background:#f9fbff;border:0;border-radius:28px;color:#171a36;box-shadow:0 10px 0 #8990ae, inset 0 0 0 5px #fffd;font-weight:1000;font-size:clamp(18px,3.3vw,44px);touch-action:none;user-select:none;-webkit-user-select:none}.zone-button:active{transform:translateY(4px);box-shadow:0 6px 0 #8990ae}.zone-button.done{opacity:.6;background:#c8ffd3;box-shadow:0 4px 0 #4a8267}.zone-caption{font-weight:900;font-size:clamp(12px,1.7vw,16px);opacity:.95;line-height:1.1;text-align:center;pointer-events:none}.game-footer{height:35px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:850;flex:0 0 auto}.progress{flex:1;max-width:470px;background:#293052;border-radius:999px;height:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#8b6aff,#ffcf51);transition:width .1s linear;width:100%}.timer{font-variant-numeric:tabular-nums;min-width:65px;text-align:right}.target{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:clamp(49px,8vw,86px);height:clamp(49px,8vw,86px);border:4px solid #fff9;border-radius:50%;font-size:clamp(20px,4vw,42px);font-weight:1000;background:#ffdc6d;color:#493112;box-shadow:0 5px 0 #b17318;touch-action:none}.target.fake{background:#7b65ad;box-shadow:0 5px 0 #463e6b;color:white}.target.bomb{background:#ff8585;box-shadow:0 5px 0 #bc4848}.emoji-big{font-size:clamp(29px,6vw,58px);line-height:1}.result-list{width:min(640px,100%);display:flex;flex-direction:column;gap:8px}.result-row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;background:#252b49;border:1px solid #636d9c55;border-radius:14px;padding:12px 15px;font-weight:950}.result-row:first-child{background:#604d32;border-color:#ffe38e66}.result-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result-points{color:#ffe18b}.winner{font-size:56px;text-shadow:0 5px 25px #ffd04f66}.mini-note{font-size:12px;color:#b8c0e2;text-align:center}.round-indicator{color:#ffe48a}.sound-btn{border:1px solid #56608c;background:#292f54;color:#e4e6ff;border-radius:11px;font-size:12px;padding:7px 9px;font-weight:900;white-space:nowrap}.summary>.glass{width:min(700px,100%);padding:15px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}.finish-banner{font-size:30px;font-weight:1000;text-align:center}.player-color{color:var(--p)}.record{color:#b8c2de;font-size:12px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}.confetti span{position:absolute;top:-25px;width:12px;height:22px;background:var(--c);animation:fall var(--d) linear forwards;left:var(--x);border-radius:3px}@keyframes fall{to{transform:translateY(115vh) rotate(840deg)}}
.arena.arena-two{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}.arena.arena-two .zone-button{width:min(82%,340px);height:min(58%,240px)}.arena.arena-two .zone-name{font-size:clamp(16px,2.5vw,27px)}
@media (orientation:portrait){.arena{gap:6px}.zone-button{height:47%;min-height:55px}.zone{border-radius:12px}.top{flex-wrap:wrap}.score-line{width:100%;justify-content:center}.game-footer{height:28px}.logo{font-size:16px}}@media(max-height:590px){.setup-panel{padding:10px;gap:7px}.hero h1{font-size:30px}.hero p{font-size:11px}.zone-top{top:4px}.zone-button{min-height:50px}.setup .hint{display:none}.summary>.glass{padding:10px}.result-row{padding:7px 10px}.game-footer{height:26px}}
</style>
</head>
<body><main id="app"></main>
<script>
(()=>{'use strict';
const colors=['#ff596d','#42a7ff','#49d38b','#ffd451'];
const gameDefs=[
 {id:'tap',name:'超高速タップバトル',icon:'⚡',desc:'10秒間、自分のボタンをできるだけ連打！',duration:10000},
 {id:'target',name:'色取りバトル',icon:'🎯',desc:'星をタップして得点！紫の×はマイナス！',duration:12000},
 {id:'five',name:'ピッタリ5秒チャレンジ',icon:'⏱️',desc:'自分のボタンを押して計測開始、5秒だと思ったら止めよう。時計は表示されない！',duration:16000},
 {id:'react',name:'反射神経王',icon:'🚦',desc:'「GO!」が出たらタップ！早押しは失格！',duration:9000},
 {id:'bomb',name:'爆弾回避ゲーム',icon:'💥',desc:'出現するゲーム内の爆弾マークを時間内にタップ！逃すと減点。',duration:14000},
 {id:'roulette',name:'運だけルーレット',icon:'🎡',desc:'数字を止めて勝負！大きい数字が強い！',duration:7000}
];
const app=document.getElementById('app');
const state={page:'setup',count:2,names:['プレイヤー1','プレイヤー2','プレイヤー3','プレイヤー4'],players:[],round:0,deck:[],game:null,values:[],done:[],data:{},sound:true,expires:0};
let audioCtx=null,ticks=[],loops=[];
function clean(){ticks.forEach(clearTimeout);loops.forEach(clearInterval);ticks=[];loops=[];}
function later(fn,delay){const id=setTimeout(fn,delay);ticks.push(id);return id;}
function repeat(fn,delay){const id=setInterval(fn,delay);loops.push(id);return id;}
function tone(freq=620,time=.08,type='sine'){if(!state.sound)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!audioCtx)audioCtx=new Audio();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(.055,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+time);osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+time+.01);}catch(e){}}
function htmlSafe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
function playerLabel(i){return `<span style="--p:${colors[i]}" class="player-color">●</span> ${htmlSafe(state.players[i].name)}`;}
function scores(){return `<div class="score-line">${state.players.map((p,i)=>`<span class="score-chip" style="--p:${p.color}"><span class="s-dot">●</span> ${htmlSafe(p.name)} ${p.points}pt</span>`).join('')}</div>`;}
function soundBtn(){return `<button class="sound-btn" data-ui="sound">${state.sound?'🔊 ON':'🔇 OFF'}</button>`;}
function head(){return `<header class="top"><span class="logo">🎉 ドタバタバトル！</span><span class="pill">ROUND ${state.round+1} / 5</span>${scores()}${soundBtn()}</header>`;}
function setup(){app.innerHTML=`<div class="page setup"><div class="hero"><span class="eyebrow">🎮 1台でワイワイ対戦</span><h1>ドタバタバトル！</h1><p>iPadをみんなで囲んで勝負だ！ 5ラウンドで優勝を決めよう！</p></div><section class="setup-panel glass"><div class="setting-line"><span class="setting-label">👥 プレイ人数</span><div class="seg"><button data-ui="count" data-count="2" class="${state.count===2?'active':''}">2人</button><button data-ui="count" data-count="3" class="${state.count===3?'active':''}">3人</button><button data-ui="count" data-count="4" class="${state.count===4?'active':''}">4人</button></div></div><div class="setting-label">✏️ プレイヤー名</div><div class="names">${colors.slice(0,state.count).map((color,i)=>`<div class="name-row" style="--p:${color}"><span class="dot"></span><label for="name${i}">P${i+1}</label><input id="name${i}" maxlength="12" data-name="${i}" value="${htmlSafe(state.names[i])}" autocomplete="off" /></div>`).join('')}</div><div class="setting-line"><span class="setting-label">🎲 ランダム5ラウンド・6種類から選出</span>${soundBtn()}</div><button class="primary" data-ui="start">🔥 対戦スタート！</button><p class="hint">ネット接続不要・課金なし！ ゲーム中はiPadを横向きに置くのがおすすめ。<br>同点の場合は同じ順位のポイントを獲得！</p></section></div>`;}
function intro(){app.innerHTML=`<div class="page intro">${head()}<div class="glass"><div class="tag">ROUND ${state.round+1} / 5</div><div class="bigemoji">${state.game.icon}</div><h2>${state.game.name}</h2><p>${state.game.desc}</p><p class="mini-note">全員が準備できたらスタートを押してね！</p><button class="primary" data-ui="launch">このゲームを開始！</button></div></div>`;}
function zoneHtml(p,i){const g=state.game.id;let main='',caption='';
 if(g==='tap'){main='<button class="zone-button" data-game="tap" data-player="'+i+'">TAP!</button>';caption='押しまくれ！';}
 else if(g==='target'||g==='bomb'){main='<span class="emoji-big">'+(g==='target'?'⭐':'💥')+'</span>';caption='光るマークをタップ！';}
 else if(g==='five'){main='<button class="zone-button" data-game="five" data-player="'+i+'">スタート</button>';caption='ぴったり5秒を狙おう！';}
 else if(g==='react'){main='<button class="zone-button" data-game="react" data-player="'+i+'">まって...</button>';caption='GO!で押す！';}
 else if(g==='roulette'){main='<button class="zone-button" data-game="roulette" data-player="'+i+'">🎲 STOP!</button>';caption='<span id="roll-'+i+'">1</span> を止めろ！';}
 return `<section class="zone" style="--p:${p.color}" id="zone-${i}"><div class="zone-top"><span class="zone-name">${htmlSafe(p.name)}</span><span class="zone-stat" id="stat-${i}">0</span></div>${main}<span class="zone-caption" id="caption-${i}">${caption}</span></section>`;}
function gameScreen(){app.innerHTML=`<div class="page play">${head()}<div class="arena ${state.count===2?'arena-two':''}">${state.players.map(zoneHtml).join('')}${state.count===3?'<div class="zone no-player"><span class="emoji-big">🎉</span><span class="zone-caption">3人モード</span></div>':''}</div><footer class="game-footer"><span class="round-indicator">${state.game.icon} ${state.game.name}</span><div class="progress"><div id="bar"></div></div><span class="timer" id="time">${Math.ceil(state.game.duration/1000)}秒</span></footer></div>`;}
function updateStat(i,s){const el=document.getElementById('stat-'+i);if(el)el.textContent=s;}
function updateCaption(i,s){const el=document.getElementById('caption-'+i);if(el)el.textContent=s;}
function btn(i){return document.querySelector(`[data-game][data-player="${i}"]`);}
function allDone(){return state.done.every(Boolean);}
function launch(){state.page='game';state.values=Array(state.count).fill(0);state.done=Array(state.count).fill(false);state.data={};clean();gameScreen();state.expires=performance.now()+state.game.duration;const gid=state.game.id;
 if(gid==='five'){state.data.started=Array(state.count).fill(null);state.values.fill(-Infinity);}
 if(gid==='react'){state.values.fill(-Infinity);state.data.green=false;const wait=2300+Math.random()*1700;later(()=>{if(state.page!=='game')return;state.data.green=true;state.data.goAt=performance.now();for(let i=0;i<state.count;i++){if(state.done[i])continue;btn(i).textContent='GO!';updateStat(i,'🟢');}tone(990,.2,'triangle');},wait);}
 if(gid==='target'||gid==='bomb'){for(let i=0;i<state.count;i++)spawnTarget(i);repeat(()=>{for(let i=0;i<state.count;i++){if(gid==='bomb'){const prev=document.querySelector(`#zone-${i} .target`);if(prev)state.values[i]-=1;updateStat(i,state.values[i]);}spawnTarget(i);}},gid==='bomb'?950:1100);}
 if(gid==='roulette'){state.data.roll=Array(state.count).fill(1);repeat(()=>{for(let i=0;i<state.count;i++){if(state.done[i])continue;state.data.roll[i]=1+Math.floor(Math.random()*9);const el=document.getElementById('roll-'+i);if(el)el.textContent=state.data.roll[i];}},90);}
 repeat(()=>{if(state.page!=='game')return;const remain=Math.max(0,state.expires-performance.now());const time=document.getElementById('time'),bar=document.getElementById('bar');if(time)time.textContent=(remain/1000).toFixed(1)+'秒';if(bar)bar.style.width=(remain/state.game.duration*100)+'%';},80);
 later(()=>endRound(),state.game.duration);
 tone(620,.1);}
function spawnTarget(i){if(state.page!=='game')return;const zone=document.getElementById('zone-'+i);if(!zone)return;zone.querySelector('.target')?.remove();const g=state.game.id;const fake=g==='target'&&Math.random()<.22;const target=document.createElement('button');target.type='button';target.className='target'+(fake?' fake':'')+(g==='bomb'?' bomb':'');target.textContent=g==='bomb'?'💣':fake?'×':'★';target.setAttribute('aria-label',fake?'フェイク':g==='bomb'?'ゲーム内爆弾':'星');target.dataset.game='target';target.dataset.player=i;target.dataset.fake=fake?'1':'0';target.style.left=(18+Math.random()*64)+'%';target.style.top=(33+Math.random()*53)+'%';zone.appendChild(target);}
function handleGame(action,i,button){if(state.page!=='game'||!Number.isInteger(i)||i<0||i>=state.count||state.done[i])return;const g=state.game.id;
 if(action==='tap'&&g==='tap'){state.values[i]+=1;updateStat(i,state.values[i]);if(state.values[i]%4===0)tone(380+state.values[i]*8,.025);}
 if(action==='target'&&(g==='target'||g==='bomb')){if(g==='target'){state.values[i]+=button.dataset.fake==='1'?-2:2;}else state.values[i]+=2;updateStat(i,state.values[i]);tone(g==='target'&&button.dataset.fake==='1'?210:720,.055);if(g==='bomb')button.remove();else spawnTarget(i);}
 if(action==='five'&&g==='five'){const now=performance.now();if(state.data.started[i]===null){state.data.started[i]=now;button.textContent='ストップ！';updateStat(i,'計測中');updateCaption(i,'時間はヒミツ！');tone(460,.08);}else{const diff=Math.abs((now-state.data.started[i])-5000);state.values[i]=-diff;state.done[i]=true;button.textContent='確定！';button.classList.add('done');updateStat(i,(diff/1000).toFixed(2)+'秒差');updateCaption(i,'結果を待とう！');tone(820,.13);if(allDone())later(endRound,550);}}
 if(action==='react'&&g==='react'){state.done[i]=true;if(!state.data.green){state.values[i]=-Infinity;button.textContent='フライング';updateStat(i,'失格');tone(190,.15);}else{state.values[i]=-(performance.now()-state.data.goAt);button.textContent='OK!';updateStat(i,Math.round(-state.values[i])+'ms');tone(820,.10);}button.classList.add('done');if(allDone())later(endRound,650);}
 if(action==='roulette'&&g==='roulette'){state.values[i]=state.data.roll[i];state.done[i]=true;button.textContent=String(state.values[i]);button.classList.add('done');updateStat(i,state.values[i]+'点');updateCaption(i,'決定！');tone(480+state.values[i]*48,.15);if(allDone())later(endRound,600);}
}
function rankData(){return state.players.map((p,i)=>({player:p,index:i,raw:state.values[i],valid:Number.isFinite(state.values[i])})).sort((a,b)=>b.raw-a.raw);}
function resultText(raw){if(!Number.isFinite(raw))return '失格 / 未参加';if(state.game.id==='five')return `${(Math.abs(raw)/1000).toFixed(2)}秒差`;if(state.game.id==='react')return `${Math.round(-raw)}ms`;if(state.game.id==='roulette')return raw+'点';return raw+'点';}
function endRound(){if(state.page!=='game')return;clean();state.page='result';const results=rankData(),award=[100,60,30,10];let lastRaw=null,lastRank=0;results.forEach((r,n)=>{if(n===0||r.raw!==lastRaw)lastRank=n;r.rank=lastRank+1;r.awarded=r.valid?award[lastRank]:0;r.player.points+=r.awarded;lastRaw=r.raw;});state.data.results=results;tone(860,.22,'triangle');resultPage();}
function resultPage(){const results=state.data.results;app.innerHTML=`<div class="page summary">${head()}<section class="glass"><span class="tag">ROUND ${state.round+1} 結果発表</span><h2>${state.game.icon} ${state.game.name}</h2><div class="result-list">${results.map(r=>`<div class="result-row"><span>${r.rank===1&&r.valid?'🥇':r.rank===2?'🥈':r.rank===3?'🥉':r.rank+'位'}</span><span class="result-name">${playerLabel(r.index)} <span class="record">${resultText(r.raw)}</span></span><span class="result-points">+${r.awarded}pt</span></div>`).join('')}</div><button class="primary" data-ui="next">${state.round===4?'🏆 最終結果へ！':'次のラウンドへ ➜'}</button></section></div>`;}
function finalPage(){state.page='final';const results=state.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.points-a.p.points);const best=results[0].p.points;results.forEach((r,n)=>{r.rank=results.findIndex(x=>x.p.points===r.p.points)+1;});app.innerHTML=`<div class="page summary"><section class="glass"><span class="tag">全5ラウンド 終了！</span><div class="winner">🏆</div><div class="finish-banner">${results.filter(r=>r.p.points===best).map(r=>htmlSafe(r.p.name)).join(' ＆ ')} の優勝！！</div><p class="mini-note">${results.filter(r=>r.p.points===best).length>1?'同点優勝！':'おめでとう！'} みんなでよく戦った！</p><div class="result-list">${results.map((r,n)=>`<div class="result-row"><span>${r.rank===1?'🥇':r.rank===2?'🥈':r.rank===3?'🥉':r.rank+'位'}</span><span class="result-name">${playerLabel(r.i)}</span><span class="result-points">${r.p.points}pt</span></div>`).join('')}</div><button class="primary" data-ui="restart">🔄 もう一度遊ぶ！</button></section></div>`;confetti();tone(880,.18);later(()=>tone(1040,.22),170);}
function confetti(){let box=document.createElement('div');box.className='confetti';for(let i=0;i<55;i++){const p=document.createElement('span');p.style.setProperty('--x',Math.random()*100+'%');p.style.setProperty('--d',2+Math.random()*3+'s');p.style.setProperty('--c',colors[i%4]);p.style.animationDelay=Math.random()*.8+'s';box.appendChild(p);}document.body.appendChild(box);setTimeout(()=>box.remove(),5800);}
function start(){state.players=colors.slice(0,state.count).map((color,i)=>({name:(state.names[i]||'').trim().slice(0,12)||'プレイヤー'+(i+1),color,points:0}));state.deck=shuffle(gameDefs).slice(0,5);state.round=0;state.game=state.deck[0];state.page='intro';tone(770,.12);intro();}
app.addEventListener('input',e=>{if(e.target.matches('[data-name]')){const i=Number(e.target.dataset.name);state.names[i]=e.target.value;}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-ui]');if(!b)return;const what=b.dataset.ui;if(what==='count'){state.count=Number(b.dataset.count);setup();}else if(what==='sound'){state.sound=!state.sound;const was=state.page;if(was==='setup')setup();else if(was==='intro')intro();else if(was==='game'){document.querySelectorAll('.sound-btn').forEach(x=>x.textContent=state.sound?'🔊 ON':'🔇 OFF');}else if(was==='result')resultPage();if(state.sound)tone(780,.09);}else if(what==='start')start();else if(what==='launch')launch();else if(what==='next'){state.round++;if(state.round===5){finalPage();}else{state.game=state.deck[state.round];state.page='intro';intro();}}else if(what==='restart'){clean();state.page='setup';setup();}});
app.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-game]');if(!b)return;e.preventDefault();handleGame(b.dataset.game,Number(b.dataset.player),b);},{passive:false});
app.addEventListener('contextmenu',e=>{if(e.target.closest('.arena'))e.preventDefault()});
setup();
})();
</script>
</body>
</html>
